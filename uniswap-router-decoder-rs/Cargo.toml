[package]
name = "uniswap-router-decoder-rs"
version = "0.1.0"
edition = "2021"
authors = ["Rust Port"]
license = "MIT"
description = "Uniswap Universal Router decoder and encoder in Rust using alloy-rs"

[dependencies]
# Alloy ecosystem for Ethereum interaction
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
alloy-provider = { version = "0.6", features = ["reqwest"] }
alloy-rpc-types = "0.6"
alloy-consensus = "0.6"
alloy-contract = "0.6"
alloy-network = "0.6"
alloy-transport = "0.6"
alloy-signer = "0.6"
alloy-signer-local = "0.6"

# Standard dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
proptest = "1.0"
